# Lancement complet : docker compose up --build
# Application : http://localhost:5173   API et documentation : http://localhost:8000/docs
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: proteine
      POSTGRES_PASSWORD: proteine
      POSTGRES_DB: proteine
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proteine"]
      interval: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://proteine:proteine@db:5432/proteine
      JWT_SECRET: dev-uniquement-changer-cette-cle-en-production
      ADMIN_PHONES: "+2250700000000"
      DEV_OTP: "1"
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  web:
    build: ./frontend
    environment:
      API_URL: http://api:8000
    ports: ["5173:5173"]
    depends_on: [api]

volumes:
  pgdata:
